name: uzaapp
description: "Buy & sell locally. Discover products, shops & new arrivals in your area."
publish_to: 'none'

version: 2.0.10+11

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.11.0
  sqlite3_flutter_libs: ^0.5.11
  path_provider: ^2.1.1
  path: ^1.8.3
  url_launcher: ^6.1.11
  font_awesome_flutter: ^10.4.0
  http: ^1.1.0
  image_picker: ^1.1.0
  encrypt: ^5.0.3
  cached_network_image: ^3.2.3
  flutter_cache_manager: ^3.4.1
  google_fonts: ^6.1.0
  provider: ^6.1.1
  intl: ^0.20.2
  intl_phone_field: ^3.1.0
  share_plus: ^7.1.0
  shimmer: ^3.0.0
  video_player: ^2.8.1
  flutter_image_compress: ^2.1.0
  image: ^4.8.0
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.6.0
  go_router: ^14.6.2
  app_links: ^6.4.0
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  timezone: ^0.10.1
  flutter_quick_video_encoder: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.11.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FE3E00"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo.png"
